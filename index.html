<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navbar — REGALO</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=Outfit:wght@700&display=swap" rel="stylesheet">

    <style>
        /* ----- global variables ----- */
        :root {
            --font-main: 'IBM Plex Sans', sans-serif;
            --color-dark-teal: #002726;
            --color-teal-hover: #004D4B;
            --color-white: #ffffff;
            --font-weight-medium: 500;
            --header-height: 72px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-font-smoothing: antialiased;
        }

        body {
            font-family: var(--font-main);
            background-color: #f4f6f5;
            min-height: 100vh;
            padding-top: var(--header-height); /* space for fixed header */
            overflow-x: hidden;
        }

        a, button, .nav-link, .mobile-nav-link, .menu-button {
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        /* ========== NAVBAR ========== */
        .header {
            position: fixed;
            top: 0;
            width: 100%;
            height: var(--header-height);
            z-index: 100;
            background-color: var(--color-white);
            border-bottom: 1px solid transparent;
            box-shadow: none;
            display: flex;
            align-items: center;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        .header.scrolled {
            border-bottom-color: #f1f5f9;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .header-container {
            width: 90%;
            margin: 0 auto;
            max-width: 1280px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            width: 140px;
            height: auto;
            display: block;
        }

        /* ----- desktop nav links ----- */
        .nav-links {
            display: none;
            align-items: center;
            gap: 4px;
        }

        @media (min-width: 768px) {
            .nav-links { display: flex; }
        }

        .nav-link {
            position: relative;
            display: flex;
            align-items: center;
            height: 40px;
            padding: 0 18px;
            font-size: 0.95rem;
            font-weight: var(--font-weight-medium);
            color: var(--color-dark-teal);
            text-decoration: none;
            line-height: 1;
            transition: color 0.2s ease;
        }

        .nav-link::after {
            content: "";
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 4px;
            height: 2px;
            background-color: var(--color-teal-hover);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.2s ease;
        }

        .nav-link:hover {
            color: var(--color-teal-hover);
        }

        .nav-link:hover::after {
            transform: scaleX(1);
        }

        /* ----- mobile menu trigger ----- */
        .menu-button {
            display: flex;
            padding: 8px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            background: #f1f5f9;
            cursor: pointer;
            color: var(--color-dark-teal);
            transition: background 0.1s;
        }

        @media (min-width: 768px) {
            .menu-button { display: none; }
        }

        #mobileMenu {
            position: fixed;
            top: var(--header-height);
            left: 0;
            width: 100%;
            background: var(--color-white);
            z-index: 90;
            transform: translateY(-110%);
            transition: transform 0.3s ease-in-out;
            padding: 8px 5% 24px;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
        }

        #mobileMenu.active {
            transform: translateY(0);
        }

        .mobile-nav-link {
            font-size: 1.05rem;
            font-weight: 500;
            text-decoration: none;
            color: var(--color-dark-teal);
            padding: 14px 4px;
            border-bottom: 1px solid #f1f5f9;
            transition: color 0.2s;
        }

        .mobile-nav-link:last-child {
            border-bottom: none;
        }

        .mobile-nav-link:hover {
            color: var(--color-teal-hover);
        }

        #menuOverlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.3);
            backdrop-filter: blur(2px);
            z-index: 80;
            display: none;
        }

        #menuOverlay.active {
            display: block;
        }
    </style>
</head>
<body>

    <!-- ===== NAVBAR ===== -->
    <header class="header">
        <div class="header-container">
            <a href="/" aria-label="Home">
                <img class="logo" src="assets/logo.png" alt="SyncSkill Logo">
            </a>

            <nav class="nav-links" aria-label="Primary">
                <a class="nav-link" href="/">Home</a>
                <a class="nav-link" href="/about">About</a>
                <a class="nav-link" href="/products">Products</a>
                <a class="nav-link" href="/careers">Careers</a>
                <a class="nav-link" href="/contact">Contact</a>
            </nav>

            <button class="menu-button" id="mobileMenuButton" aria-label="Menu" aria-expanded="false">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
        </div>
    </header>

    <!-- Mobile drawer -->
    <nav id="mobileMenu" aria-label="Primary mobile">
        <a href="/" class="mobile-nav-link">Home</a>
        <a href="/about" class="mobile-nav-link">About</a>
        <a href="/products" class="mobile-nav-link">Products</a>
        <a href="/careers" class="mobile-nav-link">Careers</a>
        <a href="/contact" class="mobile-nav-link">Contact</a>
    </nav>
    <div id="menuOverlay"></div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const mobileMenu = document.getElementById('mobileMenu');
            const mobileMenuButton = document.getElementById('mobileMenuButton');
            const menuOverlay = document.getElementById('menuOverlay');
            const header = document.querySelector('.header');

            function updateHeaderOnScroll() {
                header.classList.toggle('scrolled', window.scrollY > 0);
            }
            window.addEventListener('scroll', updateHeaderOnScroll);
            updateHeaderOnScroll();

            const hamburgerSVG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M4 12h16M4 18h16"/></svg>';
            const closeSVG = '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 18L18 6M6 6l12 12"/></svg>';

            function setMenuIcon(isOpen) {
                mobileMenuButton.innerHTML = isOpen ? closeSVG : hamburgerSVG;
                mobileMenuButton.setAttribute('aria-expanded', String(isOpen));
            }

            function toggleMenu() {
                const isActive = mobileMenu.classList.toggle('active');
                menuOverlay.classList.toggle('active');
                setMenuIcon(isActive);
                document.body.style.overflow = isActive ? 'hidden' : '';
            }

            mobileMenuButton.addEventListener('click', toggleMenu);
            menuOverlay.addEventListener('click', toggleMenu);

            window.addEventListener('resize', () => {
                if (window.innerWidth >= 768 && mobileMenu.classList.contains('active')) {
                    mobileMenu.classList.remove('active');
                    menuOverlay.classList.remove('active');
                    document.body.style.overflow = '';
                    setMenuIcon(false);
                }
            });

            setMenuIcon(false);
        });
    </script>
</body>
</html>
