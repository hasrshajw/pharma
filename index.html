<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Regalo</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

    <!-- Preload SVG icons for mobile drawer -->
    <link rel="preload" as="image" href="./assets/dashboard.svg">
    <link rel="preload" as="image" href="./assets/hover_dashboard.svg">
    <link rel="preload" as="image" href="./assets/fill_dashboard.svg">
    <link rel="preload" as="image" href="./assets/inventory.svg">
    <link rel="preload" as="image" href="./assets/hover_inventory.svg">
    <link rel="preload" as="image" href="./assets/fill_inventory.svg">
    <link rel="preload" as="image" href="./assets/coupons.svg">
    <link rel="preload" as="image" href="./assets/hover_coupons.svg">
    <link rel="preload" as="image" href="./assets/fill_coupons.svg">
    <link rel="preload" as="image" href="./assets/site.svg">
    <link rel="preload" as="image" href="./assets/hover_site.svg">
    <link rel="preload" as="image" href="./assets/fill_site.svg">
    <link rel="preload" as="image" href="./assets/popup.svg">
    <link rel="preload" as="image" href="./assets/hover_popup.svg">
    <link rel="preload" as="image" href="./assets/fill_popup.svg">

    <style>
        /* ==========================================================================
           Regalo — website color palette
           Built from the brand logo (teal #79B9BA extracted from the capsule icon)
           Style: clinical / pharma-modern, light mode
           ========================================================================== */
        :root {
            /* ---- Primary: Teal (brand) ---- */
            --teal-50:  #F1F8F8;
            --teal-100: #E0F0F0;
            --teal-200: #C2E0E0;
            --teal-300: #A1CECE;
            --teal-400: #8DC3C4;
            --teal-500: #79B9BA;
            --teal-600: #57A1A2;
            --teal-700: #457C7D;
            --teal-800: #345A5B;
            --teal-900: #243C3D;

            /* ---- Secondary: Navy (trust) ---- */
            --navy-50:  #F1F5F9;
            --navy-100: #DBE7F0;
            --navy-200: #AECBE0;
            --navy-300: #79AACD;
            --navy-400: #4084B5;
            --navy-500: #2E638A;
            --navy-600: #224E6D;
            --navy-700: #17384F;
            --navy-800: #112736;
            --navy-900: #0C1922;

            /* ---- Neutral: Slate ---- */
            --slate-50:  #F9FAFB;
            --slate-100: #F3F5F6;
            --slate-200: #E5E9EB;
            --slate-300: #CED5D9;
            --slate-400: #A5AFB6;
            --slate-500: #7F8B94;
            --slate-600: #606D76;
            --slate-700: #48535B;
            --slate-800: #2C343A;
            --slate-900: #181D21;

            /* ---- Semantic ---- */
            --color-success:       #298E5F;
            --color-success-light: #E7F8F0;
            --color-warning:       #F59F0A;
            --color-warning-light: #FEF3E2;
            --color-error:         #D62929;
            --color-error-light:   #FBEAEA;
            --color-info:          #2F8FEE;
            --color-info-light:    #E7F2FD;

            --logo-black: #000000;
            --logo-white: #FFFFFF;

            /* ---- Semantic aliases ---- */
            --bg-page:         var(--slate-50);
            --bg-surface:      var(--logo-white);
            --bg-surface-alt:  var(--slate-100);
            --bg-section-tint: var(--teal-50);

            --text-heading: var(--slate-900);
            --text-body:    var(--slate-700);
            --text-muted:   var(--slate-500);
            --text-link:    var(--teal-700);
            --text-link-hover: var(--teal-600);

            --border-default: var(--slate-300);
            --border-strong:  var(--slate-400);

            --btn-primary-bg:       var(--navy-700);
            --btn-primary-bg-hover: var(--navy-800);
            --btn-primary-text:     var(--logo-white);

            --btn-secondary-bg:       transparent;
            --btn-secondary-border:   var(--teal-600);
            --btn-secondary-text:     var(--teal-700);
            --btn-secondary-bg-hover: var(--teal-50);

            /* ---- Layout tokens carried over from the original system ---- */
            --header-height-desktop: 80px;
            --sidebar-width: 260px;
            --sidebar-collapsed-width: 90px;
            --row-height: 52px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --shadow-premium: 0 20px 25px -5px rgba(12,25,34,0.10), 0 10px 10px -5px rgba(12,25,34,0.04);
            --tooltip-bg: var(--navy-900);
            --danger-color: var(--color-error);
            --focus-ring: 0 0 0 3px rgba(121,185,186,0.45);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; text-decoration: none !important; }

        body {
            min-height: 100vh;
            background: var(--bg-page);
            font-family: "DM Sans", Roboto, sans-serif;
            font-weight: 500;
            color: var(--text-body);
            overflow-x: hidden;
        }

        /* Visible keyboard focus across all interactive elements */
        a:focus-visible, button:focus-visible {
            outline: none;
            box-shadow: var(--focus-ring);
            border-radius: var(--radius-md);
        }

        /* LOGO */
        .brand-logo { display: flex; align-items: center; text-decoration: none; transition: all 0.3s; }
        .brand-logo img { height: 60px; width: auto; display: block; }
        .mini-logo { display: none; align-items: center; justify-content: center; }
        .mini-logo img { height: 60px; width: auto; display: block; }

        /* ICON SYSTEM (used only in mobile drawer) */
        .icon { display: flex; align-items: center; justify-content: center; width: 22px; height: 22px; flex-shrink: 0; }
        .icon-custom { position: relative; width: 22px; height: 22px; }
        .icon-custom > span {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background-size: contain; background-repeat: no-repeat; background-position: center;
        }
        .icon-custom .icon-normal { display: block; }
        .icon-custom .icon-hover, .icon-custom .icon-active { display: none; }
        .nav-item:hover:not(.active) .icon-custom .icon-normal { display: none; }
        .nav-item:hover:not(.active) .icon-custom .icon-hover { display: block; }
        .nav-item.active .icon-custom .icon-normal,
        .nav-item.active .icon-custom .icon-hover { display: none; }
        .nav-item.active .icon-custom .icon-active { display: block; }

        /* ICON FILE MAPPINGS */
        .icon-dashboard .icon-normal  { background-image: url('./assets/dashboard.svg'); }
        .icon-dashboard .icon-hover   { background-image: url('./assets/hover_dashboard.svg'); }
        .icon-dashboard .icon-active  { background-image: url('./assets/fill_dashboard.svg'); }
        .icon-inventory .icon-normal  { background-image: url('./assets/inventory.svg'); }
        .icon-inventory .icon-hover   { background-image: url('./assets/hover_inventory.svg'); }
        .icon-inventory .icon-active  { background-image: url('./assets/fill_inventory.svg'); }
        .icon-coupons .icon-normal    { background-image: url('./assets/coupons.svg'); }
        .icon-coupons .icon-hover     { background-image: url('./assets/hover_coupons.svg'); }
        .icon-coupons .icon-active    { background-image: url('./assets/fill_coupons.svg'); }
        .icon-site .icon-normal       { background-image: url('./assets/site.svg'); }
        .icon-site .icon-hover        { background-image: url('./assets/hover_site.svg'); }
        .icon-site .icon-active       { background-image: url('./assets/fill_site.svg'); }
        .icon-popup .icon-normal      { background-image: url('./assets/popup.svg'); }
        .icon-popup .icon-hover       { background-image: url('./assets/hover_popup.svg'); }
        .icon-popup .icon-active      { background-image: url('./assets/fill_popup.svg'); }

        /* Recolor the drawer's inline SVG icons to match the palette via filter,
           since the source SVGs are static assets we can't recolor directly.
           Normal = slate, hover/active = teal. */
        .icon-custom .icon-normal { filter: grayscale(1) brightness(0.55) contrast(1.1); opacity: 0.9; }
        .icon-custom .icon-hover, .icon-custom .icon-active {
            filter: sepia(1) saturate(400%) hue-rotate(130deg) brightness(0.85);
        }

        /* ========== MOBILE HEADER & DRAWER ========== */
        .m-header {
            height: 72px; background: var(--bg-surface); border-bottom: 1px solid var(--border-default);
            align-items: center; justify-content: space-between;
            padding: 0 16px; position: fixed; top: 0; width: 100%; z-index: 1000;
            display: flex;
        }
        .m-menu-btn { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border-default); background: var(--bg-surface-alt); display: flex; align-items: center; justify-content: center; transition: background 0.2s, border-color 0.2s; }
        .m-menu-btn:hover { background: var(--teal-50); border-color: var(--teal-300); }
        .m-menu-lines { width: 18px; height: 14px; position: relative; }
        .m-menu-lines::before, .m-menu-lines::after, .m-menu-lines span { content: ""; position: absolute; left: 0; right: 0; height: 2px; background: var(--navy-800); border-radius: 10px; }
        .m-menu-lines::before { top: 0; }
        .m-menu-lines span { top: 6px; }
        .m-menu-lines::after { bottom: 0; }
        .m-overlay {
            position: fixed; inset: 0; background: rgba(12,25,34,0.5); opacity: 0;
            pointer-events: none; transition: 0.25s; z-index: 2000;
        }
        .m-overlay.open { opacity: 1; pointer-events: auto; }
        .m-drawer {
            position: absolute; left: 0; top: 0; width: 300px; max-width: 85vw; height: 100%;
            background: var(--bg-surface); transform: translateX(-100%); transition: 0.25s;
            display: flex; flex-direction: column; overflow-y: auto;
        }
        .m-overlay.open .m-drawer { transform: translateX(0); }
        .m-drawer-header { height: 80px; padding: 0 20px; border-bottom: 1px solid var(--border-default); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
        .m-drawer-close { width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--border-default); display: flex; align-items: center; justify-content: center; background: var(--bg-surface-alt); transition: background 0.2s, border-color 0.2s; }
        .m-drawer-close:hover { background: var(--teal-50); border-color: var(--teal-300); }
        .m-drawer-close-icon { width: 14px; height: 14px; position: relative; }
        .m-drawer-close-icon::before, .m-drawer-close-icon::after { content: ""; position: absolute; inset: 0; margin: auto; width: 14px; height: 2px; background: var(--navy-800); }
        .m-drawer-close-icon::before { transform: rotate(45deg); }
        .m-drawer-close-icon::after { transform: rotate(-45deg); }
        .m-drawer-nav { padding: 20px 12px; flex: 1; }

        /* Mobile nav items */
        .nav-item {
            position: relative; display: flex; align-items: center; height: var(--row-height);
            padding: 0 16px; margin: 2px 0; border-radius: var(--radius-md); gap: 14px;
            cursor: pointer; color: var(--text-body); text-decoration: none;
            font-size: 0.95rem;
            transition: background 0.2s, color 0.2s; white-space: nowrap; user-select: none;
        }
        .nav-item:hover { background: var(--bg-section-tint); color: var(--teal-700); }
        .nav-item.active { background: var(--teal-50); color: var(--navy-700); font-weight: 700; }
        .nav-item.active::before {
            content: ""; position: absolute; left: 0; top: 10%; bottom: 10%; width: 3px;
            background: var(--teal-500); border-radius: 0 4px 4px 0;
        }

        /* ========== DESKTOP TOP NAVBAR ========== */
        .desktop-navbar {
            display: none;
            position: fixed;
            top: 0;
            width: 100%;
            height: var(--header-height-desktop);
            background: var(--bg-surface);
            border-bottom: 1px solid var(--border-default);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .desktop-navbar-container {
            width: 90%;
            max-width: 1280px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .desktop-logo img {
            height: 60px;
            width: auto;
        }
        .desktop-nav-links {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .desktop-nav-link {
            position: relative;
            display: flex;
            align-items: center;
            height: 40px;
            padding: 0 18px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-body);
            text-decoration: none;
            line-height: 1;
            border-radius: 8px;
            transition: color 0.2s ease, background 0.2s ease;
        }
        .desktop-nav-link::after {
            content: "";
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 4px;
            height: 2px;
            background-color: var(--teal-500);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.2s ease;
        }
        .desktop-nav-link:hover {
            color: var(--teal-700);
        }
        .desktop-nav-link:hover::after {
            transform: scaleX(1);
        }
        .desktop-nav-link.active {
            background: var(--teal-50);
            color: var(--navy-700);
            font-weight: 700;
        }
        .desktop-nav-link.active::after {
            transform: scaleX(1);
            background-color: var(--navy-700);
        }

        /* Primary CTA on the desktop navbar — the trust-carrying navy button */
        .navbar-cta {
            display: inline-flex;
            align-items: center;
            height: 42px;
            padding: 0 22px;
            margin-left: 8px;
            border-radius: var(--radius-md);
            background: var(--btn-primary-bg);
            color: var(--btn-primary-text) !important;
            font-size: 0.95rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .navbar-cta:hover { background: var(--btn-primary-bg-hover); }

        /* ========== MAIN CONTENT ========== */
        .main-content {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 16px;
            background: var(--bg-page);
        }

        /* ========== RESPONSIVE ========== */
        @media (min-width: 769px) {
            .desktop-navbar { display: flex; }
            .m-header { display: none !important; }
            .main-content {
                padding-top: var(--header-height-desktop);
            }
        }

        @media (max-width: 768px) {
            .desktop-navbar { display: none !important; }
            .main-content {
                padding-top: 80px;
            }
        }
    </style>
</head>
<body>

    <!-- ========== MOBILE HEADER ========== -->
    <header class="m-header" id="mobile-header">
        <button class="m-menu-btn" id="m-open-drawer" aria-label="Open menu">
            <div class="m-menu-lines"><span></span></div>
        </button>
        <a href="#" class="brand-logo">
            <img src="./assets/logo.png" alt="Regalo">
        </a>
        <div style="width:40px;"></div>
    </header>

    <!-- ========== MOBILE DRAWER OVERLAY ========== -->
    <div class="m-overlay" id="m-overlay">
        <div class="m-drawer">
            <div class="m-drawer-header">
                <span class="brand-logo">
                    <img src="./assets/logo.png" alt="Regalo">
                </span>
                <button class="m-drawer-close" id="m-close-drawer" aria-label="Close menu">
                    <div class="m-drawer-close-icon"></div>
                </button>
            </div>

            <nav class="m-drawer-nav">
                <!-- HOME ACTIVE -->
                <a href="#" class="nav-item active">
                    <span class="icon icon-custom icon-dashboard">
                        <span class="icon-normal"></span>
                        <span class="icon-hover"></span>
                        <span class="icon-active"></span>
                    </span>
                    <span class="nav-label">Home</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="icon icon-custom icon-site">
                        <span class="icon-normal"></span>
                        <span class="icon-hover"></span>
                        <span class="icon-active"></span>
                    </span>
                    <span class="nav-label">About</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="icon icon-custom icon-inventory">
                        <span class="icon-normal"></span>
                        <span class="icon-hover"></span>
                        <span class="icon-active"></span>
                    </span>
                    <span class="nav-label">Products</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="icon icon-custom icon-coupons">
                        <span class="icon-normal"></span>
                        <span class="icon-hover"></span>
                        <span class="icon-active"></span>
                    </span>
                    <span class="nav-label">Careers</span>
                </a>
                <a href="#" class="nav-item">
                    <span class="icon icon-custom icon-popup">
                        <span class="icon-normal"></span>
                        <span class="icon-hover"></span>
                        <span class="icon-active"></span>
                    </span>
                    <span class="nav-label">Contact</span>
                </a>
            </nav>
        </div>
    </div>

    <!-- ========== DESKTOP TOP NAVBAR ========== -->
    <header class="desktop-navbar">
        <div class="desktop-navbar-container">
            <a href="#" class="desktop-logo">
                <img src="./assets/logo.png" alt="Regalo">
            </a>
            <nav class="desktop-nav-links">
                <a class="desktop-nav-link active" href="#">Home</a>
                <a class="desktop-nav-link" href="#">About</a>
                <a class="desktop-nav-link" href="#">Products</a>
                <a class="desktop-nav-link" href="#">Careers</a>
                <a class="desktop-nav-link" href="#">Contact</a>
                <button class="navbar-cta">Contact sales</button>
            </nav>
        </div>
    </header>

    <!-- ========== MAIN CONTENT (empty landing area) ========== -->
    <main class="main-content">
        <!-- Content intentionally left blank – this is a landing page -->
    </main>

    <!-- ========== JAVASCRIPT ========== -->
    <script>
        // ========== SVG PRELOAD ==========
        [
            './assets/dashboard.svg','./assets/hover_dashboard.svg','./assets/fill_dashboard.svg',
            './assets/inventory.svg','./assets/hover_inventory.svg','./assets/fill_inventory.svg',
            './assets/coupons.svg','./assets/hover_coupons.svg','./assets/fill_coupons.svg',
            './assets/site.svg','./assets/hover_site.svg','./assets/fill_site.svg',
            './assets/popup.svg','./assets/hover_popup.svg','./assets/fill_popup.svg'
        ].forEach(src => { const i = new Image(); i.src = src; });

        // ========== MOBILE DRAWER ==========
        const mOverlay = document.getElementById('m-overlay');
        document.getElementById('m-open-drawer').onclick = () => mOverlay.classList.add('open');
        document.getElementById('m-close-drawer').onclick = () => mOverlay.classList.remove('open');
        mOverlay.onclick = (e) => { if (e.target === mOverlay) mOverlay.classList.remove('open'); };

        // Mobile nav active state
        document.querySelectorAll('.m-drawer-nav .nav-item').forEach(item => {
            item.addEventListener('click', function () {
                document.querySelectorAll('.m-drawer-nav .nav-item').forEach(i => i.classList.remove('active'));
                this.classList.add('active');
            });
        });

        // ========== DESKTOP NAV ACTIVE STATE ==========
        document.querySelectorAll('.desktop-nav-link').forEach(link => {
            link.addEventListener('click', function (e) {
                e.preventDefault();
                document.querySelectorAll('.desktop-nav-link').forEach(l => l.classList.remove('active'));
                this.classList.add('active');
            });
        });
    </script>
</body>
</html>
